<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CamPick · 커뮤니티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --color-bg:#fbfbfe; --color-surface:#ffffff; --color-title:#111111;
    --color-body:#595e90; --color-muted:#9a9dc0; --color-border:rgba(89,94,144,0.14);
    --color-accent:#4d31fc; --color-accent-2:#4732f7;
    --grad-primary: linear-gradient(90deg,#3d70fb,#7e3efc);
    --shadow-card: 0 2px 14px rgba(31,29,90,0.07);
    --safe-top: env(safe-area-inset-top,0px);
    --safe-bottom: env(safe-area-inset-bottom,0px);
    --nav-h: 64px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--color-bg); }
  body{ font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; }
  .icon{ display:inline-block; background-color:currentColor; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center; -webkit-mask-size:contain; mask-size:contain; flex-shrink:0; }

  .app{ max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; background:var(--color-bg); position:relative; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }

  .topbar{ padding: calc(var(--safe-top) + 14px) 20px 6px; }
  .topbar h1{ margin:0; font-size: clamp(20px,5.4vw,24px); font-weight:800; color:var(--color-title); letter-spacing:-0.02em; }

  .tab-row{ display:flex; gap:22px; padding: 14px 20px 14px; border-bottom:1px solid var(--color-border); margin-bottom:20px; }
  .tab{ font-size: clamp(13.5px,3.7vw,14.5px); font-weight:700; color:var(--color-muted); cursor:pointer; padding-bottom:12px; margin-bottom:-1px; border-bottom:2px solid transparent; white-space:nowrap; }
  .tab.active{ color:var(--color-title); border-color:var(--color-accent-2); }

  .section{ padding: 0 20px; }
  .section-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .section-title h2{ margin:0; font-size: clamp(17px,4.6vw,19px); font-weight:800; color:var(--color-title); letter-spacing:-0.02em; }
  .section-title .more{ font-size:12.5px; color:var(--color-muted); font-weight:600; cursor:pointer; }

  /* 대표 커뮤니티 배너 */
  .comm-banner{ margin:0 20px 26px; border-radius:20px; padding:22px; background: linear-gradient(135deg,#3d70fb,#7e3efc); color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow-card); cursor:pointer; }
  .comm-banner .icon-wm{ position:absolute; right:-6px; bottom:-10px; width:100px; height:100px; color:rgba(255,255,255,0.16); }
  .comm-banner .eyebrow{ font-size:12px; font-weight:700; opacity:.85; margin-bottom:6px; }
  .comm-banner h3{ margin:0 0 8px; font-size: clamp(18px,5vw,21px); font-weight:800; letter-spacing:-0.02em; }
  .comm-banner .members{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; opacity:.9; }
  .comm-banner .members .icon{ width:14px; height:14px; }

  /* 인기 게시글 카드 */
  .post-scroll{ display:flex; gap:12px; overflow-x:auto; padding: 0 20px 4px; margin: 0 -20px 30px; -ms-overflow-style:none; scrollbar-width:none; }
  .post-scroll::-webkit-scrollbar{ display:none; }
  .post-card{ scroll-snap-align:start; flex:0 0 auto; width:min(62vw,220px); background:var(--color-surface); border:1px solid var(--color-border); border-radius:16px; padding:16px; box-shadow:var(--shadow-card); cursor:pointer; }
  .post-tag{ display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:#eef0ff; color:#4338ca; margin-bottom:10px; }
  .mine-badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px; background:rgba(71,50,247,0.08); color:var(--color-accent-2); margin:0 0 10px 5px; }
  .post-title{ font-size:14px; font-weight:700; color:var(--color-title); line-height:1.4; margin:0 0 14px; min-height:2.8em; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .post-stats{ display:flex; align-items:center; gap:12px; }
  .stat{ display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--color-muted); font-weight:600; }
  .stat .icon{ width:13px; height:13px; }

  /* 실시간 모집글 카드 */
  .recruit-list{ display:flex; flex-direction:column; gap:12px; padding: 0 20px; }
  .recruit-card{ display:flex; align-items:center; gap:14px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow-card); cursor:pointer; }
  .recruit-body{ flex:1; min-width:0; }
  .recruit-tag{ display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; margin-bottom:8px; }
  .recruit-title{ font-weight:700; font-size: clamp(14px,3.8vw,15px); color:var(--color-title); line-height:1.35; margin:0 0 6px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }
  .recruit-org{ font-size:12px; color:var(--color-muted); font-weight:600; }
  .recruit-cap{ flex-shrink:0; text-align:center; }
  .recruit-cap .num{ font-size:13px; font-weight:800; color:var(--color-accent-2); white-space:nowrap; }
  .cap-bar{ width:44px; height:4px; border-radius:2px; background:#eceafd; margin-top:6px; overflow:hidden; }
  .cap-bar-fill{ height:100%; background:var(--grad-primary); border-radius:2px; }

  /* 글 작성하기 FAB */
  .fab{ position:fixed; right:max(20px, calc((100vw - 480px)/2 + 20px)); bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); background:var(--grad-primary); color:#fff; border:none; border-radius:999px; padding:14px 18px 14px 16px; display:flex; align-items:center; gap:7px; font-weight:700; font-size:13.5px; box-shadow:0 8px 20px rgba(77,49,252,0.35); cursor:pointer; z-index:15; transition: transform .12s ease, box-shadow .12s ease; }
  .fab:hover{ box-shadow:0 10px 24px rgba(77,49,252,0.42); }
  .fab:active{ transform:scale(0.94); }
  .fab .icon{ width:17px; height:17px; background-color:#fff; }

  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--color-surface); border-top:1px solid var(--color-border); display:flex; padding-bottom:var(--safe-bottom); box-shadow: 0 -4px 16px rgba(31,29,90,0.05); }
  .app-wrap{ max-width:480px; margin:0 auto; position:relative; }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 4px 8px; color:var(--color-muted); cursor:pointer; }
  .nav-item .icon{ width:22px; height:22px; }
  .nav-item span{ font-size:10.5px; font-weight:600; }
  .nav-item.active{ color:var(--color-accent-2); }
</style>
</head>
<body>

<div class="app-wrap">
<div class="app">

  <div class="topbar"><h1>커뮤니티</h1></div>

  <div class="tab-row" id="tabRow"></div>

  <div class="comm-banner" onclick="location.href='#'">
    <span class="icon icon-wm" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:code.svg');mask-image:url('https://api.iconify.design/iconoir:code.svg');"></span>
    <div class="eyebrow">추천 커뮤니티</div>
    <h3>IT / 개발 커뮤니티</h3>
    <div class="members">
      <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:group.svg');mask-image:url('https://api.iconify.design/iconoir:group.svg');"></span>
      멤버 2.1k명
    </div>
  </div>

  <section class="section">
    <div class="section-title"><h2>인기 게시글</h2><span class="more">더보기</span></div>
  </section>
  <div class="post-scroll" id="postScroll"></div>

  <section class="section">
    <div class="section-title"><h2>실시간 모집글</h2><span class="more">더보기</span></div>
  </section>
  <div class="recruit-list" id="recruitList"></div>

</div>
</div>

<button class="fab" onclick="location.href='write.html'">
  <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:edit-pencil.svg');mask-image:url('https://api.iconify.design/iconoir:edit-pencil.svg');"></span>
  글 작성하기
</button>

<nav class="bottom-nav">
  <div class="app-wrap" style="width:100%;">
    <div style="display:flex;">
      <a class="nav-item" href="home.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:home.svg');mask-image:url('https://api.iconify.design/iconoir:home.svg');"></span>
        <span>홈</span>
      </a>
      <a class="nav-item" href="search.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:search.svg');mask-image:url('https://api.iconify.design/iconoir:search.svg');"></span>
        <span>탐색</span>
      </a>
      <a class="nav-item active" href="community.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:community.svg');mask-image:url('https://api.iconify.design/iconoir:community.svg');"></span>
        <span>커뮤니티</span>
      </a>
      <a class="nav-item" href="save.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:bookmark.svg');mask-image:url('https://api.iconify.design/iconoir:bookmark.svg');"></span>
        <span>저장</span>
      </a>
      <a class="nav-item" href="mypage.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:profile-circle.svg');mask-image:url('https://api.iconify.design/iconoir:profile-circle.svg');"></span>
        <span>마이페이지</span>
      </a>
    </div>
  </div>
</nav>

<script src="js/posts.js"></script>
<script>
  function iconMask(name){ return `-webkit-mask-image:url('https://api.iconify.design/${name}.svg');mask-image:url('https://api.iconify.design/${name}.svg');`; }

  const tabs = ['학교별','인기글','모집','관심사별'];
  document.getElementById('tabRow').innerHTML = tabs.map((t,i)=>`<div class="tab ${i===0?'active':''}">${t}</div>`).join('');
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); });
  });

  const posts = [
    { tag:'UX 스터디', title:'졸업작품 준비 팀 공유합니다!', like:12, comment:8 },
    { tag:'시각디자인 20학번', title:'알고리즘 스터디 함께해요', like:9, comment:5 },
    { tag:'컴퓨터공학과', title:'동아리 기획전 후기 나눠요', like:15, comment:12 },
  ];
  // 내가 쓴 글(localStorage)을 앞에 붙인다
  const cards = loadPosts().map(p => ({
    tag: p.category, title: escapeHtml(p.title), like:0, comment:0,
    href: `detail.html?id=${encodeURIComponent(p.id)}`, mine:true,
  })).concat(posts.map(p => ({ ...p, href:'detail.html' })));

  document.getElementById('postScroll').innerHTML = cards.map(p => `
    <div class="post-card" onclick="location.href='${p.href}'">
      <span class="post-tag">${p.tag}</span>
      ${p.mine ? '<span class="mine-badge">내가 쓴 글</span>' : ''}
      <p class="post-title">${p.title}</p>
      <div class="post-stats">
        <span class="stat"><span class="icon" style="${iconMask('iconoir:heart')}"></span>${p.like}</span>
        <span class="stat"><span class="icon" style="${iconMask('iconoir:message-text')}"></span>${p.comment}</span>
      </div>
    </div>
  `).join('');

  const RECRUIT_COLORS = { '스터디':{bg:'#e8fbf0',fg:'#059669'}, '프로젝트':{bg:'#f2ecff',fg:'#7c3aed'}, '대외활동':{bg:'#fef2f2',fg:'#dc2626'} };
  const recruits = [
    { tag:'스터디', title:'프론트엔드 스터디 팀원 모집', org:'IT/개발 · 서울', cur:3, max:5 },
    { tag:'프로젝트', title:'앱 서비스 기획 프로젝트 팀원 구해요!', org:'기획 · 연세대', cur:2, max:4 },
    { tag:'대외활동', title:'대학생 마케팅 서포터즈 15기 모집', org:'마케팅 · 전국', cur:5, max:10 },
  ];
  document.getElementById('recruitList').innerHTML = recruits.map(r => {
    const c = RECRUIT_COLORS[r.tag];
    const pct = Math.round(r.cur / r.max * 100);
    return `
    <div class="recruit-card" onclick="location.href='detail.html'">
      <div class="recruit-body">
        <span class="recruit-tag" style="background:${c.bg};color:${c.fg};">${r.tag}</span>
        <p class="recruit-title">${r.title}</p>
        <span class="recruit-org">${r.org}</span>
      </div>
      <div class="recruit-cap">
        <span class="num">${r.cur}/${r.max}명</span>
        <div class="cap-bar"><div class="cap-bar-fill" style="width:${pct}%;"></div></div>
      </div>
    </div>`;
  }).join('');
</script>

</body>
</html>
