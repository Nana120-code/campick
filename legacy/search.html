<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CamPick · 탐색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --color-bg:#fbfbfe; --color-surface:#ffffff; --color-title:#111111;
    --color-body:#595e90; --color-muted:#9a9dc0; --color-border:rgba(89,94,144,0.14);
    --color-accent:#4d31fc; --color-accent-2:#4732f7;
    --grad-primary: linear-gradient(90deg,#3d70fb,#7e3efc);
    --shadow-card: 0 2px 14px rgba(31,29,90,0.07);
    --safe-top: env(safe-area-inset-top,0px);
    --safe-bottom: env(safe-area-inset-bottom,0px);
    --nav-h: 64px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--color-bg); }
  body{ font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; }
  .icon{ display:inline-block; background-color:currentColor; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center; -webkit-mask-size:contain; mask-size:contain; flex-shrink:0; }

  .app{ max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; background:var(--color-bg); position:relative; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }

  .topbar{ padding: calc(var(--safe-top) + 14px) 20px 6px; }
  .topbar h1{ margin:0; font-size: clamp(20px,5.4vw,24px); font-weight:800; color:var(--color-title); letter-spacing:-0.02em; }

  .search-bar{ margin: 12px 20px 16px; background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:14px; padding: 4px 14px; display:flex; align-items:center; gap:10px; transition: border-color .15s ease; }
  .search-bar:focus-within{ border-color: var(--color-accent-2); }
  .search-bar .icon{ width:18px; height:18px; color:var(--color-muted); flex-shrink:0; }
  .search-bar input{ border:none; outline:none; background:transparent; width:100%; font-family:inherit; font-size: clamp(13px,3.6vw,14.5px); font-weight:500; color:var(--color-title); padding:11px 0; }
  .search-bar input::placeholder{ color:var(--color-muted); }

  .chip-scroll{ display:flex; gap:8px; overflow-x:auto; padding:0 20px 4px; margin:0 -20px 22px; -ms-overflow-style:none; scrollbar-width:none; }
  .chip-scroll::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; background:var(--color-surface); border:1px solid var(--color-border); color:var(--color-body); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; white-space:nowrap; cursor:pointer; }

  .filter-row{ display:flex; align-items:center; justify-content:space-between; padding: 0 20px 14px; }
  .segmented{ display:flex; background:#f1f2fa; border-radius:10px; padding:3px; gap:2px; }
  .segmented button{ appearance:none; border:none; background:transparent; padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--color-muted); cursor:pointer; }
  .segmented button.active{ background:var(--color-surface); color:var(--color-title); box-shadow:0 1px 4px rgba(31,29,90,0.12); }
  .sort-btn{ display:flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; color:var(--color-body); cursor:pointer; }
  .sort-btn .icon{ width:14px; height:14px; }

  .list{ padding:0 20px; display:flex; flex-direction:column; gap:12px; }
  .card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:16px; padding:16px; box-shadow:var(--shadow-card); cursor:pointer; transition:transform .12s ease; }
  .card:active{ transform:scale(0.98); }
  .tag-row{ display:flex; align-items:center; gap:6px; margin-bottom:9px; }
  .tag{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
  .sep{ color:var(--color-border); font-size:11px; }
  .card-title{ font-weight:800; font-size: clamp(15px,4vw,16.5px); color:var(--color-title); margin:0 0 6px; letter-spacing:-0.01em; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }
  .card-desc{ font-size: clamp(12.5px,3.4vw,13.5px); color:var(--color-body); line-height:1.5; margin:0 0 12px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; }
  .deadline{ font-size:11.5px; font-weight:700; color:#ef4444; }
  .stat-row{ display:flex; align-items:center; gap:12px; }
  .stat{ display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--color-muted); font-weight:600; }
  .stat .icon{ width:13px; height:13px; }

  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--color-surface); border-top:1px solid var(--color-border); display:flex; padding-bottom:var(--safe-bottom); box-shadow: 0 -4px 16px rgba(31,29,90,0.05); }
  .app-wrap{ max-width:480px; margin:0 auto; position:relative; }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 4px 8px; color:var(--color-muted); cursor:pointer; }
  .nav-item .icon{ width:22px; height:22px; }
  .nav-item span{ font-size:10.5px; font-weight:600; }
  .nav-item.active{ color:var(--color-accent-2); }
</style>
</head>
<body>

<div class="app-wrap">
<div class="app">

  <div class="topbar"><h1>탐색</h1></div>

  <div class="search-bar">
    <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:search.svg');mask-image:url('https://api.iconify.design/iconoir:search.svg');"></span>
    <input type="search" placeholder="검색어를 입력하세요" />
  </div>

  <div class="chip-scroll" id="popularChips"></div>

  <div class="filter-row">
    <div class="segmented" id="segmented"></div>
    <div class="sort-btn">
      <span>마감임박순</span>
      <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:nav-arrow-down.svg');mask-image:url('https://api.iconify.design/iconoir:nav-arrow-down.svg');"></span>
    </div>
  </div>

  <div class="list" id="resultList"></div>

</div>
</div>

<nav class="bottom-nav">
  <div class="app-wrap" style="width:100%;">
    <div style="display:flex;">
      <a class="nav-item" href="home.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:home.svg');mask-image:url('https://api.iconify.design/iconoir:home.svg');"></span>
        <span>홈</span>
      </a>
      <a class="nav-item active" href="search.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:search.svg');mask-image:url('https://api.iconify.design/iconoir:search.svg');"></span>
        <span>탐색</span>
      </a>
      <a class="nav-item" href="community.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:community.svg');mask-image:url('https://api.iconify.design/iconoir:community.svg');"></span>
        <span>커뮤니티</span>
      </a>
      <a class="nav-item" href="save.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:bookmark.svg');mask-image:url('https://api.iconify.design/iconoir:bookmark.svg');"></span>
        <span>저장</span>
      </a>
      <a class="nav-item" href="mypage.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:profile-circle.svg');mask-image:url('https://api.iconify.design/iconoir:profile-circle.svg');"></span>
        <span>마이페이지</span>
      </a>
    </div>
  </div>
</nav>

<script>
  const TAG_COLORS = {
    '디자인':{bg:'#f2ecff',fg:'#7c3aed'}, '공모전':{bg:'#eef0ff',fg:'#4338ca'},
    'IT / 개발':{bg:'#e6f4ff',fg:'#2563eb'}, 'IT':{bg:'#e6f4ff',fg:'#2563eb'},
    '스터디':{bg:'#e8fbf0',fg:'#059669'}, '해커톤':{bg:'#eefcf3',fg:'#16a34a'},
  };
  const DEFAULT_TAG = {bg:'#f1f2fa', fg:'#595e90'};
  function tagChip(label){ const c = TAG_COLORS[label]||DEFAULT_TAG; return `<span class="tag" style="background:${c.bg};color:${c.fg};">${label}</span>`; }
  function iconMask(name){ return `-webkit-mask-image:url('https://api.iconify.design/${name}.svg');mask-image:url('https://api.iconify.design/${name}.svg');`; }

  const popular = ['디자인 공모전','데이터 분석','창업 아이템','해커톤','스터디 모집'];
  document.getElementById('popularChips').innerHTML = popular.map(p=>`<div class="chip">${p}</div>`).join('');

  const segments = ['전체','대외활동','스터디','공모전'];
  document.getElementById('segmented').innerHTML = segments.map((s,i)=>`<button class="${i===0?'active':''}">${s}</button>`).join('');

  const results = [
    { tags:['디자인','공모전'], title:'2024 대한민국 디자인 공모전', desc:'창의적인 아이디어로 세상을 디자인하세요!', deadline:'~05.20 마감', eye:'1.2k', comment:'124', icon:'iconoir:trophy', img:'images/f91e48b0e0005d9292e92cabf5bc54a6ba19c1c6.png' },
    { tags:['IT / 개발','스터디'], title:'데이터 분석 스터디 모집', desc:'함께 성장할 데이터 분석 스터디 팀원을 찾습니다!', deadline:'~04.30 마감', eye:'856', comment:'86', icon:'iconoir:group', img:'images/d934f432971daebbbd3bad4e0a7369038c81d215.png' },
    { tags:['IT','해커톤'], title:'ESG 아이디어 해커톤', desc:'지속 가능한 미래를 위한 아이디어를 제안해 주세요.', deadline:'~06.07 마감', eye:'1.5k', comment:'152', icon:'iconoir:fire-flame', img:'images/845ab5ef3e4a00562bac76b9c8b2b988318c6a7f.png' },
  ];
  document.getElementById('resultList').innerHTML = results.map(r => `
    <div class="card" onclick="location.href='detail.html'">
      <div class="tag-row">${r.tags.map(tagChip).join('<span class="sep">ㅣ</span>')}</div>
      <p class="card-title">${r.title}</p>
      <p class="card-desc">${r.desc}</p>
      <div class="card-foot">
        <span class="deadline">${r.deadline}</span>
        <div class="stat-row">
          <span class="stat"><span class="icon" style="${iconMask('iconoir:eye-empty')}"></span>${r.eye}</span>
          <span class="stat"><span class="icon" style="${iconMask('iconoir:message-text')}"></span>${r.comment}</span>
        </div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.segmented button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.segmented button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
</script>

</body>
</html>
