<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CamPick · 온보딩</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />

<style>
  :root{
    --design-w: 430;
    --color-bg: #fbfbfe;
    --color-title: #111111;
    --color-accent: #4d31fc;
    --color-accent-2: #4732f7;
    --color-body: #595e90;
    --color-border: rgba(89,94,144,0.5);
    --color-btn-from: #3d70fb;
    --color-btn-to: #7e3efc;
    --color-logo-from: #00ddff;
    --color-logo-to: #9564fb;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; overflow:hidden; }
  body{
    background: var(--color-bg);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    justify-content:center;
    height:100vh;
    height:100dvh;
  }

  /* ─────────────────────────────────────────────────────────
     아이콘 (Iconify를 CSS mask로 사용 → 색상 자유롭게 제어)
  ───────────────────────────────────────────────────────── */
  .icon{
    display:inline-block;
    background-color: currentColor;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-size:contain; mask-size:contain;
    flex-shrink:0;
  }

  /* ─────────────────────────────────────────────────────────
     화면 전환 셸
  ───────────────────────────────────────────────────────── */
  .app-shell{
    position:relative;
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--color-bg);
  }
  .track{
    display:flex;
    width:300%;
    height:100%;
    transition: transform .5s cubic-bezier(.65,0,.35,1);
    will-change: transform;
  }
  .screen{
    flex:0 0 33.3333%;
    width:33.3333%;
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-top:var(--safe-top);
    padding-bottom:var(--safe-bottom);
  }

  /* progress dots (상단 브라우저 진행 안내 - 화면 간 위치 표시) */
  .flow-progress{
    position:absolute;
    top: max(12px, var(--safe-top));
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:5;
  }
  .flow-progress span{
    width:20px; height:4px; border-radius:2px;
    background: rgba(89,94,144,0.25);
    transition: background .3s ease, width .3s ease;
  }
  .flow-progress span.active{ background: linear-gradient(90deg,var(--color-btn-from),var(--color-btn-to)); width:28px; }

  /* 뒤로가기 아이콘 */
  .back-btn{
    appearance:none; border:none; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    width: clamp(40px, 11vw, 48px);
    height: clamp(40px, 11vw, 48px);
    margin: clamp(12px, 4dvh, 40px) 0 0 clamp(8px, 2vw, 14px);
    color: var(--color-title);
    border-radius:50%;
    flex-shrink:0;
  }
  .back-btn:hover{ background: rgba(89,94,144,0.08); }
  .back-btn .icon{ width:22px; height:22px; }

  /* ── 공통 텍스트 블록 ─────────────────────────────────── */
  .heading{
    padding: clamp(10px, 3vw, 20px) clamp(24px, 7.5vw, 32px) 0;
  }
  .heading h1{
    margin:0 0 10px;
    font-weight:700;
    font-size: clamp(22px, 6.3vw, 30px);
    line-height:1.4;
    letter-spacing:-0.015em;
    color: var(--color-title);
  }
  .heading p{
    margin:0;
    font-weight:500;
    font-size: clamp(13px, 3.5vw, 15px);
    line-height:1.5;
    letter-spacing:-0.015em;
    color: var(--color-body);
  }
  .heading p .accent{ font-weight:700; color: var(--color-accent); }

  .spacer{ flex:1 1 auto; }

  /* ── CTA 버튼 ─────────────────────────────────────────── */
  .cta-section{
    padding: 0 20px clamp(10px, 2.5dvh, 24px);
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    flex-shrink:0;
  }
  .cta-button{
    width:100%;
    min-height:48px;
    height: clamp(48px, 8dvh, 74px);
    border:none;
    border-radius:12px;
    background: linear-gradient(90deg, var(--color-btn-from), var(--color-btn-to));
    color:#fff;
    font-family:inherit;
    font-weight:500;
    font-size: clamp(16px, 4.65vw, 20px);
    letter-spacing:-0.025em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: transform .15s ease, filter .15s ease, opacity .2s ease;
  }
  .cta-button:hover{ filter:brightness(1.05); }
  .cta-button:active{ transform: scale(0.98); }
  .cta-button:focus-visible{
    outline:3px solid #fff; outline-offset:2px;
    box-shadow:0 0 0 5px rgba(61,112,251,0.5);
  }
  .cta-button:disabled{
    opacity:.45; cursor:not-allowed; transform:none; filter:none;
  }

  @media (prefers-reduced-motion: reduce){
    .track, .cta-button{ transition:none; }
  }

  /* ══════════════════════════════════════════════════════
     화면 1 — 인트로
  ══════════════════════════════════════════════════════ */
  .logo-section{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0px;
    padding: clamp(8px, 3dvh, 26px) 0 clamp(4px, 1dvh, 12px);
    flex-shrink:0;
  }
  .logo-mark{ width: clamp(90px, 22dvh, 190px); aspect-ratio: 96/108.255; }
  .logo-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .logo-text{
    font-family:'Outfit', sans-serif; font-weight:800;
    font-size: clamp(22px, 6dvh, 37px);
    line-height:1.1;
    background: linear-gradient(180deg, var(--color-logo-from) 3.3%, var(--color-logo-to) 91.4%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0; margin-top:-8px;
    text-align:center;
  }
  .s1-title{ text-align:center; padding: clamp(4px,1.5dvh,14px) clamp(20px,8vw,40px) 0; flex-shrink:0; }
  .s1-title p{ margin:0 0 4px; font-weight:700; font-size:clamp(20px,5dvh,30px); line-height:1.3; letter-spacing:-0.015em; color:var(--color-title); }
  .s1-title p:last-child{ margin-bottom:0; }
  .s1-title .accent{ color:var(--color-accent); }
  .s1-sub{ text-align:center; padding: clamp(6px,2dvh,18px) clamp(24px,10vw,50px); flex-shrink:0; }
  .s1-sub p{ margin:0; font-weight:500; font-size:clamp(12px,2.8dvh,15px); line-height:1.4; letter-spacing:-0.015em; color:var(--color-body); }
  .hero-image{ width:100%; flex:1 1 auto; min-height:0; position:relative; overflow:hidden; margin-top:clamp(4px,1dvh,12px); }
  .hero-image img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ══════════════════════════════════════════════════════
     화면 2 — 학교 인증
  ══════════════════════════════════════════════════════ */
  .s2-body{ padding: clamp(10px, 3dvh, 36px) clamp(20px, 6vw, 32px) 0; flex-shrink:0; }
  .school-input{
    margin: clamp(10px, 3dvh, 32px) clamp(20px, 6vw, 32px) 0;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: clamp(10px, 2dvh, 18px) clamp(14px, 4vw, 18px);
    display:flex;
    align-items:center;
    gap: 12px;
    flex-shrink:0;
  }
  .school-input .icon{ width:26px; height:26px; color: var(--color-body); }
  .school-input input{
    border:none; outline:none; background:transparent;
    font-family:inherit; width:100%;
    font-weight:500; font-size: clamp(13px, 3.6vw, 15px);
    color: var(--color-title);
    letter-spacing:-0.02em;
  }
  .school-input input::placeholder{ color: var(--color-body); opacity:.55; }
  .school-input .placeholder-sub{
    display:block; font-size:0.82em; margin-top:2px; color:var(--color-body); opacity:.55;
    max-height:20px; overflow:hidden;
    transition: opacity .2s ease, max-height .2s ease, margin-top .2s ease;
  }
  .school-input .placeholder-sub.hide{ opacity:0; max-height:0; margin-top:0; }
  .school-input.error{ border-color:#ef4444; }
  .hint-link{
    display:block; text-align:center; margin-top: clamp(6px, 1.5dvh, 20px);
    font-weight:600; font-size: clamp(13px, 3.6vw, 15px); color: var(--color-body);
    letter-spacing:-0.015em; text-decoration:none;
    flex-shrink:0;
  }
  .s2-hero{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding: clamp(4px,1dvh,16px) 40px; }
  .s2-hero img{ width:100%; max-width:266px; max-height:100%; height:auto; object-fit:contain; }

  /* ══════════════════════════════════════════════════════
     화면 3 — 관심사 선택
  ══════════════════════════════════════════════════════ */
  .s3-top-row{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding-top: max(12px, var(--safe-top));
    flex-shrink:0;
  }
  .s3-top-row .back-btn{ grid-column:1; justify-self:start; margin:0 0 0 clamp(4px,1.5vw,10px); }
  .s3-top-row .stepper{ grid-column:2; justify-self:center; }
  .s3-top-row .s3-top-row-spacer{ grid-column:3; }
  .stepper{ display:flex; align-items:center; gap:5px; }
  .stepper .dot{
    width: clamp(20px, min(6vw, 4.6dvh), 26px);
    height: clamp(20px, min(6vw, 4.6dvh), 26px);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(71,50,247,0.12);
    color: var(--color-accent-2);
    font-weight:700; font-size: clamp(11px, 2.6dvh, 13px);
    flex-shrink:0;
  }
  .stepper .dot.done{ background: var(--color-accent-2); color:#fff; }
  .stepper .dot.done .icon{ width:13px; height:13px; background-color:#fff; }
  .stepper .dot.current{ background: var(--color-accent-2); color:#fff; }
  .stepper .line{ width: clamp(28px, 9vw, 64px); height:2px; background: var(--color-accent-2); flex-shrink:0; }

  .s3-heading{ padding: clamp(16px,4.5dvh,32px) clamp(20px,6vw,32px) 0; flex-shrink:0; }
  .s3-heading h1{ margin:0 0 8px; font-weight:700; font-size:clamp(20px, min(6.3vw, 3.6dvh), 30px); line-height:1.3; letter-spacing:-0.015em; color:var(--color-title); }
  .s3-heading p{ margin:0; font-weight:500; font-size:clamp(12px, min(3.5vw, 2dvh), 15px); line-height:1.4; color:var(--color-body); }
  .s3-heading .accent{ font-weight:700; color:var(--color-accent); }

  .interest-grid{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: clamp(6px, 1.4dvh, 12px);
    padding: clamp(10px,2.2dvh,26px) clamp(18px,5vw,26px) 0;
  }
  .tile{
    appearance:none; cursor:pointer; position:relative;
    width:100%; height:100%;
    min-height:0;
    border: 1px solid var(--color-border);
    border-radius: 13px;
    background: #fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: clamp(2px, 1dvh, 10px);
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
    font-family:inherit;
  }
  .tile:active{ transform: scale(0.97); }
  .tile .icon{
    width: clamp(20px, 5.5dvh, 38px);
    height: clamp(20px, 5.5dvh, 38px);
    color: var(--color-title);
    transition: color .15s ease;
  }
  .tile span.label{
    font-weight:700; font-size: clamp(11px, 2.3dvh, 14px);
    color: var(--color-title);
    text-align:center;
  }
  .tile .check-dot{
    position:absolute; top:8px; right:8px;
    width:16px; height:16px; border-radius:50%;
    border: 1.5px solid var(--color-border);
    background:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .tile .check-dot .icon{ width:10px; height:10px; background-color:#fff; opacity:0; transition:opacity .15s ease; }
  .tile.selected{
    border-color: var(--color-accent-2);
    background: rgba(71,50,247,0.06);
  }
  .tile.selected .icon:not(.check-dot .icon){ color: var(--color-accent-2); }
  .tile.selected span.label{ color: var(--color-accent-2); }
  .tile.selected .check-dot{ background: var(--color-accent-2); border-color: var(--color-accent-2); }
  .tile.selected .check-dot .icon{ opacity:1; }

  .s3-counter{
    text-align:center; padding: clamp(6px,1.2dvh,20px) 20px 0;
    font-weight:600; font-size: clamp(12px,3.2vw,13px); color: var(--color-body);
    flex-shrink:0;
  }
  .s3-counter b{ color: var(--color-accent-2); }
</style>
</head>
<body>

  <div class="app-shell">
    <div class="track" id="track">

      <!-- ══════════════ 화면 1 : 인트로 ══════════════ -->
      <section class="screen" data-screen="0" aria-label="온보딩 1 - 소개">
        <section class="logo-section">
          <div class="logo-mark">
            <img src="캠픽-로고 1.png" alt="CamPick 로고" />
          </div>
          <p class="logo-text">CamPick</p>
        </section>

        <section class="s1-title">
          <p>캠퍼스 라이프</p>
          <p>필요한 정보만 <span class="accent">PICK!</span></p>
        </section>

        <section class="s1-sub">
          <p>당신의 캠퍼스 라이프를</p>
          <p>더 편리하고 즐겁게</p>
          <p>CamPick이 함께합니다.</p>
        </section>

        <div class="hero-image">
          <img src="image1.png" alt="캠퍼스 라이프를 즐기는 학생들 일러스트" />
        </div>

        <section class="cta-section">
          <button class="cta-button" type="button" onclick="goTo(1)">시작하기</button>
        </section>
      </section>

      <!-- ══════════════ 화면 2 : 학교 인증 ══════════════ -->
      <section class="screen" data-screen="1" aria-label="온보딩 2 - 학교 인증">
        <button class="back-btn" type="button" onclick="goTo(0)" aria-label="이전으로">
          <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/mdi:chevron-left.svg'); mask-image:url('https://api.iconify.design/mdi:chevron-left.svg'); width:28px; height:28px;"></span>
        </button>

        <div class="s2-body">
          <h1 style="margin:0 0 10px;font-weight:700;font-size:clamp(20px, min(6.3vw, 3.6dvh), 30px);line-height:1.3;letter-spacing:-0.015em;color:var(--color-title);">
            우리 학교를<br>인증해 주세요
          </h1>
          <p style="margin:0;font-weight:500;font-size:clamp(12px, min(3.5vw, 2dvh), 15px);line-height:1.4;color:var(--color-body);">
            학교 인증 후 더 정확한 정보를<br>추천받을 수 있어요.
          </p>
        </div>

        <div class="school-input" id="schoolInputBox">
          <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/material-symbols:mail-outline.svg'); mask-image:url('https://api.iconify.design/material-symbols:mail-outline.svg');"></span>
          <div style="width:100%;">
            <input id="schoolEmail" type="email" placeholder="학교 이메일을 입력해주세요." />
            <span class="placeholder-sub">(ex. Osan123@university.ac.kr)</span>
          </div>
        </div>

        <a class="hint-link" href="#" onclick="return false;">학교 이메일 아닌가요?</a>

        <div class="s2-hero">
          <img src="ChatGPT Image 2026년 7월 9일 오후 07_27_26 1.png" alt="학교 인증 일러스트" />
        </div>

        <section class="cta-section">
          <button class="cta-button" type="button" onclick="handleVerify()">인증하기</button>
        </section>
      </section>

      <!-- ══════════════ 화면 3 : 관심사 선택 ══════════════ -->
      <section class="screen" data-screen="2" aria-label="온보딩 3 - 관심사 선택">
        <div class="s3-top-row">
          <button class="back-btn" type="button" onclick="goTo(1)" aria-label="이전으로">
            <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/mdi:chevron-left.svg'); mask-image:url('https://api.iconify.design/mdi:chevron-left.svg'); width:28px; height:28px;"></span>
          </button>

          <div class="stepper">
            <div class="dot done">
              <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/mdi:check-bold.svg'); mask-image:url('https://api.iconify.design/mdi:check-bold.svg');"></span>
            </div>
            <div class="line"></div>
            <div class="dot done">
              <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/mdi:check-bold.svg'); mask-image:url('https://api.iconify.design/mdi:check-bold.svg');"></span>
            </div>
            <div class="line"></div>
            <div class="dot current">3</div>
          </div>

          <div class="s3-top-row-spacer" aria-hidden="true"></div>
        </div>

        <div class="s3-heading">
          <h1>관심사를 선택해 주세요</h1>
          <p>선택한 관심사에 맞는 정보를 추천해 드릴게요 <span class="accent">(최소 3개 선택)</span></p>
        </div>

        <div class="interest-grid" id="interestGrid">
          <!-- JS로 렌더링 -->
        </div>

        <p class="s3-counter" id="s3Counter"><b>0</b>/3개 이상 선택해주세요</p>

        <section class="cta-section">
          <button class="cta-button" type="button" id="finishBtn" disabled onclick="handleFinish()">선택 완료</button>
        </section>
      </section>

    </div>
  </div>

<script>
  // ── 화면 전환 ────────────────────────────────────────────
  const track = document.getElementById('track');
  let current = 0;
  function goTo(idx){
    current = Math.max(0, Math.min(2, idx));
    track.style.transform = `translateX(-${current * 33.3333}%)`;
  }

  // ── 화면 2 : 입력창 포커스 인터랙션 ───────────────────────
  const emailInput = document.getElementById('schoolEmail');
  const placeholderSub = document.querySelector('.placeholder-sub');
  const originalPlaceholder = emailInput.placeholder;

  emailInput.addEventListener('focus', () => {
    emailInput.placeholder = '';
    placeholderSub.classList.add('hide');
  });
  emailInput.addEventListener('blur', () => {
    if(!emailInput.value){
      emailInput.placeholder = originalPlaceholder;
      placeholderSub.classList.remove('hide');
    }
  });

  // ── 화면 2 : 이메일 검증 ──────────────────────────────────
  function handleVerify(){
    const box = document.getElementById('schoolInputBox');
    const val = document.getElementById('schoolEmail').value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
    if(!valid){
      box.classList.add('error');
      box.animate(
        [{ transform:'translateX(0)' },{ transform:'translateX(-6px)' },{ transform:'translateX(6px)' },{ transform:'translateX(0)' }],
        { duration:280 }
      );
      return;
    }
    box.classList.remove('error');
    goTo(2);
  }

  // ── 화면 3 : 관심사 선택 ──────────────────────────────────
  const interests = [
    { label:'디자인',        icon:'iconoir:design-pencil' },
    { label:'IT / 개발',     icon:'iconoir:code' },
    { label:'영상 / 미디어', icon:'iconoir:play' },
    { label:'마케팅',        icon:'iconoir:megaphone' },
    { label:'여행 / 캠핑',   icon:'streamline:camping-tent' },
    { label:'사진',          icon:'iconoir:camera' },
    { label:'음악',          icon:'iconoir:music-note' },
    { label:'창업',          icon:'iconoir:light-bulb' },
    { label:'인문 / 사회',   icon:'iconoir:book' },
  ];
  const selected = new Set();
  const grid = document.getElementById('interestGrid');
  const counterEl = document.getElementById('s3Counter');
  const finishBtn = document.getElementById('finishBtn');

  interests.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';
    btn.setAttribute('aria-pressed', 'false');
    btn.innerHTML = `
      <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/${item.icon}.svg'); mask-image:url('https://api.iconify.design/${item.icon}.svg');"></span>
      <span class="label">${item.label}</span>
      <span class="check-dot">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/mdi:check-bold.svg'); mask-image:url('https://api.iconify.design/mdi:check-bold.svg');"></span>
      </span>
    `;
    btn.addEventListener('click', () => {
      if(selected.has(i)){ selected.delete(i); btn.classList.remove('selected'); btn.setAttribute('aria-pressed','false'); }
      else{ selected.add(i); btn.classList.add('selected'); btn.setAttribute('aria-pressed','true'); }
      updateCounter();
    });
    grid.appendChild(btn);
  });

  function updateCounter(){
    const n = selected.size;
    if(n >= 3){
      counterEl.innerHTML = `<b>${n}</b>개 선택완료! 더 선택할 수 있어요`;
      finishBtn.disabled = false;
    } else {
      counterEl.innerHTML = `<b>${n}</b>/3개 이상 선택해주세요`;
      finishBtn.disabled = true;
    }
  }

  function handleFinish(){
    if(selected.size < 3) return;
    finishBtn.textContent = '완료! 🎉';
    finishBtn.disabled = true;
    // 완료 표시를 잠깐 보여준 뒤 홈 화면으로 이동
    setTimeout(() => {
      window.location.href = 'home.html';
    }, 1200);
  }
</script>

</body>
</html>
