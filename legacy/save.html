<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CamPick · 저장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --color-bg:#fbfbfe; --color-surface:#ffffff; --color-title:#111111;
    --color-body:#595e90; --color-muted:#9a9dc0; --color-border:rgba(89,94,144,0.14);
    --color-accent:#4d31fc; --color-accent-2:#4732f7;
    --grad-primary: linear-gradient(90deg,#3d70fb,#7e3efc);
    --shadow-card: 0 2px 14px rgba(31,29,90,0.07);
    --safe-top: env(safe-area-inset-top,0px);
    --safe-bottom: env(safe-area-inset-bottom,0px);
    --nav-h: 64px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--color-bg); }
  body{ font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; }
  .icon{ display:inline-block; background-color:currentColor; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center; -webkit-mask-size:contain; mask-size:contain; flex-shrink:0; }

  .app{ max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; background:var(--color-bg); position:relative; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }

  .topbar{ padding: calc(var(--safe-top) + 14px) 20px 6px; display:flex; align-items:center; justify-content:space-between; }
  .topbar h1{ margin:0; font-size: clamp(20px,5.4vw,24px); font-weight:800; color:var(--color-title); letter-spacing:-0.02em; }
  .edit-btn{ appearance:none; border:none; background:transparent; font-size:13.5px; font-weight:700; color:var(--color-accent-2); cursor:pointer; padding:6px 4px; }

  .meta-row{ display:flex; align-items:center; justify-content:space-between; padding: 14px 20px 18px; }
  .meta-row .count{ font-size:13.5px; font-weight:700; color:var(--color-body); }
  .meta-row .count b{ color:var(--color-title); }
  .sort-btn{ display:flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; color:var(--color-body); cursor:pointer; }
  .sort-btn .icon{ width:14px; height:14px; }

  .list{ padding:0 20px; display:flex; flex-direction:column; gap:12px; }
  .card{ display:flex; align-items:flex-start; gap:12px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:16px; padding:16px; box-shadow:var(--shadow-card); cursor:pointer; transition:transform .12s ease, box-shadow .15s ease; }
  .card:active{ transform:scale(0.98); }
  .checkbox{ display:none; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--color-border); flex-shrink:0; margin-top:2px; align-items:center; justify-content:center; background:#fff; }
  .checkbox .icon{ width:11px; height:11px; background-color:#fff; opacity:0; }
  .checkbox.checked{ background:var(--color-accent-2); border-color:var(--color-accent-2); }
  .checkbox.checked .icon{ opacity:1; }
  .edit-mode .checkbox{ display:flex; }
  .card-main{ flex:1; min-width:0; }
  .tag-row{ display:flex; align-items:center; gap:6px; margin-bottom:9px; }
  .tag{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
  .card-title{ font-weight:800; font-size: clamp(15px,4vw,16.5px); color:var(--color-title); margin:0 0 6px; letter-spacing:-0.01em; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }
  .card-desc{ font-size: clamp(12.5px,3.4vw,13.5px); color:var(--color-body); line-height:1.5; margin:0 0 12px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; }
  .deadline{ font-size:11.5px; font-weight:700; color:#ef4444; }
  .stat-row{ display:flex; align-items:center; gap:12px; }
  .stat{ display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--color-muted); font-weight:600; }
  .stat .icon{ width:13px; height:13px; }
  .bookmark-btn{ flex-shrink:0; width:30px; height:30px; border-radius:50%; background:#f1f2fa; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; }
  .bookmark-btn .icon{ width:15px; height:15px; color:var(--color-accent-2); }
  .edit-mode .bookmark-btn{ display:none; }

  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--color-surface); border-top:1px solid var(--color-border); display:flex; padding-bottom:var(--safe-bottom); box-shadow: 0 -4px 16px rgba(31,29,90,0.05); }
  .app-wrap{ max-width:480px; margin:0 auto; position:relative; }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 4px 8px; color:var(--color-muted); cursor:pointer; }
  .nav-item .icon{ width:22px; height:22px; }
  .nav-item span{ font-size:10.5px; font-weight:600; }
  .nav-item.active{ color:var(--color-accent-2); }
</style>
</head>
<body>

<div class="app-wrap">
<div class="app">

  <div class="topbar">
    <h1>저장</h1>
    <button class="edit-btn" id="editBtn">편집</button>
  </div>

  <div class="meta-row">
    <span class="count">전체 <b id="totalCount">12</b></span>
    <div class="sort-btn">
      <span>최신순</span>
      <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:nav-arrow-down.svg');mask-image:url('https://api.iconify.design/iconoir:nav-arrow-down.svg');"></span>
    </div>
  </div>

  <div class="list" id="savedList"></div>

</div>
</div>

<nav class="bottom-nav">
  <div class="app-wrap" style="width:100%;">
    <div style="display:flex;">
      <a class="nav-item" href="home.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:home.svg');mask-image:url('https://api.iconify.design/iconoir:home.svg');"></span>
        <span>홈</span>
      </a>
      <a class="nav-item" href="search.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:search.svg');mask-image:url('https://api.iconify.design/iconoir:search.svg');"></span>
        <span>탐색</span>
      </a>
      <a class="nav-item" href="community.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:community.svg');mask-image:url('https://api.iconify.design/iconoir:community.svg');"></span>
        <span>커뮤니티</span>
      </a>
      <a class="nav-item active" href="save.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:bookmark.svg');mask-image:url('https://api.iconify.design/iconoir:bookmark.svg');"></span>
        <span>저장</span>
      </a>
      <a class="nav-item" href="mypage.html">
        <span class="icon" style="-webkit-mask-image:url('https://api.iconify.design/iconoir:profile-circle.svg');mask-image:url('https://api.iconify.design/iconoir:profile-circle.svg');"></span>
        <span>마이페이지</span>
      </a>
    </div>
  </div>
</nav>

<script>
  const TAG_COLORS = {
    '공모전':{bg:'#eef0ff',fg:'#4338ca'}, '디자인':{bg:'#f2ecff',fg:'#7c3aed'},
    '스터디':{bg:'#e8fbf0',fg:'#059669'}, 'IT/개발':{bg:'#e6f4ff',fg:'#2563eb'}, 'IT':{bg:'#e6f4ff',fg:'#2563eb'},
    '대외활동':{bg:'#fef2f2',fg:'#dc2626'}, '행사':{bg:'#fff1e6',fg:'#ea580c'}, '문화/예술':{bg:'#fdf4e3',fg:'#b45309'},
    '여행':{bg:'#e6fbfb',fg:'#0891b2'}, '제주':{bg:'#e6fbfb',fg:'#0891b2'},
  };
  const DEFAULT_TAG = {bg:'#f1f2fa', fg:'#595e90'};
  function tagChip(label){ const c = TAG_COLORS[label]||DEFAULT_TAG; return `<span class="tag" style="background:${c.bg};color:${c.fg};">${label}</span>`; }
  function iconMask(name){ return `-webkit-mask-image:url('https://api.iconify.design/${name}.svg');mask-image:url('https://api.iconify.design/${name}.svg');`; }

  const saved = [
    { tags:['공모전','디자인'], title:'2026 대한민국 디자인 공모전', desc:'창의적인 아이디어로 세상을 디자인하세요!', deadline:'~05.20 마감', eye:'1.2K', comment:'124' },
    { tags:['스터디','IT/개발'], title:'데이터 분석 스터디 모집', desc:'함께 성장할 데이터 분석 스터디 팀원을 찾습니다!', deadline:'~04.30 마감', eye:'856', comment:'86' },
    { tags:['대외활동','IT'], title:'ESG 아이디어 해커톤', desc:'지속 가능한 미래를 위한 아이디어를 제안해 주세요.', deadline:'~06.07 마감', eye:'1.5K', comment:'152' },
    { tags:['행사','문화/예술'], title:'봄맞이 캠퍼스 페스티벌', desc:'다양한 공연과 체험 프로그램이 가득!', deadline:'~05.16 마감', eye:'632', comment:'52' },
    { tags:['여행','제주'], title:'제주도 2박 3일 번개 여행', desc:'제주 자연 속에서 힐링하고 싶은 사람 모여라!', deadline:'~05.10 마감', eye:'478', comment:'38' },
  ];

  const listEl = document.getElementById('savedList');
  listEl.innerHTML = saved.map((it, i) => `
    <div class="card" data-idx="${i}" onclick="handleCardClick(${i})">
      <div class="checkbox" id="chk-${i}">
        <span class="icon" style="${iconMask('iconoir:check')}"></span>
      </div>
      <div class="card-main">
        <div class="tag-row">${it.tags.map(tagChip).join('')}</div>
        <p class="card-title">${it.title}</p>
        <p class="card-desc">${it.desc}</p>
        <div class="card-foot">
          <span class="deadline">${it.deadline}</span>
          <div class="stat-row">
            <span class="stat"><span class="icon" style="${iconMask('iconoir:eye-empty')}"></span>${it.eye}</span>
            <span class="stat"><span class="icon" style="${iconMask('iconoir:message-text')}"></span>${it.comment}</span>
          </div>
        </div>
      </div>
      <button class="bookmark-btn" onclick="event.stopPropagation();unsave(${i})" aria-label="저장 취소">
        <span class="icon" style="${iconMask('iconoir:bookmark-solid')}"></span>
      </button>
    </div>
  `).join('');

  let editMode = false;
  const selected = new Set();
  const editBtn = document.getElementById('editBtn');
  editBtn.addEventListener('click', () => {
    editMode = !editMode;
    listEl.classList.toggle('edit-mode', editMode);
    editBtn.textContent = editMode ? '완료' : '편집';
    if(!editMode) selected.clear();
    document.querySelectorAll('.checkbox').forEach(c => c.classList.remove('checked'));
  });

  function handleCardClick(i){
    if(editMode){
      const chk = document.getElementById('chk-'+i);
      if(selected.has(i)){ selected.delete(i); chk.classList.remove('checked'); }
      else{ selected.add(i); chk.classList.add('checked'); }
    } else {
      location.href = 'detail.html';
    }
  }
  function unsave(i){
    document.querySelector(`.card[data-idx="${i}"]`).style.display = 'none';
  }
</script>

</body>
</html>
